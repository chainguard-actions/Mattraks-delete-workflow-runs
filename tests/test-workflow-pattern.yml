name: Test delete workflow pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: "0"
          keep_minimum_runs: "0"
          delete_workflow_pattern: "CI"
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"
          dry_run: "true"
      - name: Assert action completed with workflow pattern
        run: |
          echo "Action completed with delete_workflow_pattern=CI in dry-run mode"
          echo "PASS"
