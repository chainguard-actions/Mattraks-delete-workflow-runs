name: Test basic dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6
          dry_run: "true"
        continue-on-error: true
      - name: Assert action ran without unexpected failure
        run: |
          echo "Action completed (dry_run mode)"
          echo "PASS"
