name: Test delete run by conclusion pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6
          dry_run: "true"
          delete_run_by_conclusion_pattern: "success"
      - name: Assert conclusion pattern filter completed without error
        run: |
          echo "PASS: delete_run_by_conclusion_pattern input accepted and processed"
